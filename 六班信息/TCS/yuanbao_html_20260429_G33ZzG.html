<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可穿墙贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #4CAF50;
            font-size: 2.8rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        
        .subtitle {
            color: #a0a0c0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        .game-board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .game-board-wrapper {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        #gameCanvas {
            background-color: #0d1021;
            display: block;
        }
        
        .score-board {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            min-width: 250px;
            margin-top: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .score-section {
            margin-bottom: 20px;
        }
        
        .score-title {
            font-size: 1.2rem;
            color: #a0a0c0;
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .high-score-value {
            color: #FF9800;
        }
        
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .control-label {
            font-size: 1rem;
            color: #a0a0c0;
        }
        
        .control-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }
        
        .instructions {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 25px;
            max-width: 400px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .instructions h2 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .instructions ul {
            list-style-type: none;
            padding-left: 0;
        }
        
        .instructions li {
            margin-bottom: 12px;
            padding-left: 25px;
            position: relative;
            line-height: 1.5;
        }
        
        .instructions li:before {
            content: "•";
            color: #4CAF50;
            font-size: 1.5rem;
            position: absolute;
            left: 0;
            top: -3px;
        }
        
        .game-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            width: 200px;
        }
        
        button:hover {
            background-color: #3d8b40;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button#pauseBtn {
            background-color: #FF9800;
        }
        
        button#pauseBtn:hover {
            background-color: #f57c00;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }
        
        button#restartBtn {
            background-color: #2196F3;
        }
        
        button#restartBtn:hover {
            background-color: #0b7dda;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }
        
        .game-status {
            font-size: 1.3rem;
            font-weight: bold;
            height: 30px;
            color: #FF9800;
        }
        
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            max-width: 300px;
        }
        
        .mobile-btn {
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            user-select: none;
            border: none;
        }
        
        .mobile-btn:active {
            background-color: rgba(76, 175, 80, 0.7);
        }
        
        #upBtn {
            grid-column: 2;
            grid-row: 1;
        }
        
        #leftBtn {
            grid-column: 1;
            grid-row: 2;
        }
        
        #rightBtn {
            grid-column: 3;
            grid-row: 2;
        }
        
        #downBtn {
            grid-column: 2;
            grid-row: 3;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #a0a0c0;
            font-size: 0.9rem;
        }
        
        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            
            .instructions {
                max-width: 500px;
            }
        }
        
        @media (max-width: 600px) {
            #gameCanvas {
                width: 100%;
                height: auto;
            }
            
            .mobile-controls {
                display: grid;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>穿墙贪吃蛇</h1>
        <p class="subtitle">从一边穿出，从另一边进入！</p>
    </div>
    
    <div class="game-container">
        <div class="game-board-section">
            <div class="game-board-wrapper">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>
            
            <div class="game-controls">
                <div class="game-status" id="gameStatus">按空格键开始游戏</div>
                <div>
                    <button id="startBtn">开始游戏</button>
                    <button id="pauseBtn">暂停游戏</button>
                    <button id="restartBtn">重新开始</button>
                </div>
                
                <div class="mobile-controls">
                    <button class="mobile-btn" id="upBtn">↑</button>
                    <button class="mobile-btn" id="leftBtn">←</button>
                    <button class="mobile-btn" id="rightBtn">→</button>
                    <button class="mobile-btn" id="downBtn">↓</button>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <ul>
                <li>使用键盘 <strong>方向键</strong> 或 <strong>WASD</strong> 控制蛇的移动方向</li>
                <li>按 <strong>空格键</strong> 开始/暂停游戏</li>
                <li>蛇吃到食物会变长，并且得分增加</li>
                <li>当蛇头碰到自己的身体时，游戏结束</li>
                <li><strong>穿墙功能</strong>：蛇可以从一边穿出，从另一边进入</li>
                <li>游戏速度会随着得分增加而逐渐加快</li>
                <li>目标：尽可能获得高分，打破自己的记录！</li>
            </ul>
            
            <div class="score-board">
                <div class="score-section">
                    <div class="score-title">当前得分</div>
                    <div class="score-value" id="currentScore">0</div>
                </div>
                
                <div class="score-section">
                    <div class="score-title">最高分</div>
                    <div class="score-value high-score-value" id="highScore">0</div>
                </div>
                
                <div class="controls-section">
                    <div class="control-item">
                        <span class="control-label">速度等级</span>
                        <span class="control-value" id="speedLevel">1</span>
                    </div>
                    <div class="control-item">
                        <span class="control-label">蛇身长度</span>
                        <span class="control-value" id="snakeLength">3</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>© 2025 穿墙贪吃蛇游戏 | 使用HTML5 Canvas制作</p>
    </div>

    <script>
        // 获取Canvas和Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏状态变量
        let game = {
            running: false,
            score: 0,
            highScore: localStorage.getItem('snakeHighScore') || 0,
            speed: 10,
            speedLevel: 1,
            gameLoop: null
        };
        
        // 蛇的初始状态
        let snake = {
            x: 10,
            y: 10,
            dx: 1,  // 水平方向速度
            dy: 0,  // 垂直方向速度
            cells: [],  // 蛇身体的各个部分
            maxCells: 3  // 初始长度
        };
        
        // 食物的位置
        let food = {
            x: 15,
            y: 15
        };
        
        // 获取DOM元素
        const currentScoreElement = document.getElementById('currentScore');
        const highScoreElement = document.getElementById('highScore');
        const speedLevelElement = document.getElementById('speedLevel');
        const snakeLengthElement = document.getElementById('snakeLength');
        const gameStatusElement = document.getElementById('gameStatus');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        // 移动控制按钮
        const upBtn = document.getElementById('upBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const downBtn = document.getElementById('downBtn');
        
        // 初始化游戏
        function initGame() {
            // 重置蛇的状态
            snake = {
                x: 10,
                y: 10,
                dx: 1,
                dy: 0,
                cells: [],
                maxCells: 3
            };
            
            // 重置分数
            game.score = 0;
            game.speed = 10;
            game.speedLevel = 1;
            
            // 生成第一个食物
            generateFood();
            
            // 更新UI
            updateUI();
            gameStatusElement.textContent = "游戏已重置，按空格键开始";
            
            // 绘制初始状态
            draw();
        }
        
        // 生成食物
        function generateFood() {
            // 生成随机位置
            food.x = Math.floor(Math.random() * 30);
            food.y = Math.floor(Math.random() * 30);
            
            // 确保食物不会生成在蛇身上
            for (let cell of snake.cells) {
                if (cell.x === food.x && cell.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }
        
        // 绘制游戏
        function draw() {
            // 清除画布
            ctx.fillStyle = '#0d1021';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            drawGrid();
            
            // 绘制蛇
            ctx.fillStyle = '#4CAF50';
            for (let i = 0; i < snake.cells.length; i++) {
                const cell = snake.cells[i];
                
                // 蛇头用不同颜色
                if (i === 0) {
                    ctx.fillStyle = '#2E7D32'; // 深绿色蛇头
                } else {
                    // 蛇身使用渐变颜色
                    const colorValue = Math.max(100, 255 - i * 5);
                    ctx.fillStyle = `rgb(76, ${colorValue}, 80)`;
                }
                
                // 绘制蛇的每一节
                ctx.fillRect(cell.x * 20, cell.y * 20, 18, 18);
                
                // 绘制蛇头眼睛
                if (i === 0) {
                    ctx.fillStyle = '#FFF';
                    // 根据移动方向绘制眼睛
                    if (snake.dx === 1) { // 向右移动
                        ctx.fillRect(cell.x * 20 + 12, cell.y * 20 + 5, 3, 3);
                        ctx.fillRect(cell.x * 20 + 12, cell.y * 20 + 13, 3, 3);
                    } else if (snake.dx === -1) { // 向左移动
                        ctx.fillRect(cell.x * 20 + 3, cell.y * 20 + 5, 3, 3);
                        ctx.fillRect(cell.x * 20 + 3, cell.y * 20 + 13, 3, 3);
                    } else if (snake.dy === 1) { // 向下移动
                        ctx.fillRect(cell.x * 20 + 5, cell.y * 20 + 12, 3, 3);
                        ctx.fillRect(cell.x * 20 + 13, cell.y * 20 + 12, 3, 3);
                    } else { // 向上移动
                        ctx.fillRect(cell.x * 20 + 5, cell.y * 20 + 3, 3, 3);
                        ctx.fillRect(cell.x * 20 + 13, cell.y * 20 + 3, 3, 3);
                    }
                }
            }
            
            // 绘制食物
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(food.x * 20 + 10, food.y * 20 + 10, 9, 0, Math.PI * 2);
            ctx.fill();
            
            // 给食物添加高光效果
            ctx.fillStyle = '#FF8A80';
            ctx.beginPath();
            ctx.arc(food.x * 20 + 6, food.y * 20 + 6, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            // 绘制垂直线
            for (let x = 0; x <= canvas.width; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 绘制水平线
            for (let y = 0; y <= canvas.height; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // 更新游戏状态
        function update() {
            // 移动蛇
            snake.x += snake.dx;
            snake.y += snake.dy;
            
            // 穿墙逻辑：从一边穿出，从另一边进入
            if (snake.x >= 30) snake.x = 0;
            if (snake.x < 0) snake.x = 29;
            if (snake.y >= 30) snake.y = 0;
            if (snake.y < 0) snake.y = 29;
            
            // 添加新的蛇头位置
            snake.cells.unshift({x: snake.x, y: snake.y});
            
            // 如果蛇的长度超过最大长度，移除尾部
            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }
            
            // 检查是否吃到食物
            if (snake.x === food.x && snake.y === food.y) {
                // 增加蛇的长度
                snake.maxCells++;
                
                // 增加分数
                game.score += 10;
                
                // 每得100分增加速度
                if (game.score % 100 === 0) {
                    game.speed = Math.min(game.speed + 2, 20);
                    game.speedLevel++;
                }
                
                // 生成新食物
                generateFood();
                
                // 更新UI
                updateUI();
            }
            
            // 检查蛇是否撞到自己
            for (let i = 1; i < snake.cells.length; i++) {
                if (snake.cells[i].x === snake.x && snake.cells[i].y === snake.y) {
                    gameOver();
                    return;
                }
            }
            
            // 绘制更新后的游戏状态
            draw();
        }
        
        // 游戏结束
        function gameOver() {
            game.running = false;
            clearInterval(game.gameLoop);
            
            // 更新最高分
            if (game.score > game.highScore) {
                game.highScore = game.score;
                localStorage.setItem('snakeHighScore', game.highScore);
                gameStatusElement.textContent = "游戏结束！新纪录！";
            } else {
                gameStatusElement.textContent = "游戏结束！按空格键重新开始";
            }
            
            // 更新UI
            updateUI();
        }
        
        // 更新UI显示
        function updateUI() {
            currentScoreElement.textContent = game.score;
            highScoreElement.textContent = game.highScore;
            speedLevelElement.textContent = game.speedLevel;
            snakeLengthElement.textContent = snake.maxCells;
        }
        
        // 开始游戏
        function startGame() {
            if (game.running) return;
            
            game.running = true;
            gameStatusElement.textContent = "游戏中...";
            
            // 清除之前的游戏循环
            if (game.gameLoop) clearInterval(game.gameLoop);
            
            // 开始新的游戏循环
            game.gameLoop = setInterval(update, 1000 / game.speed);
        }
        
        // 暂停/继续游戏
        function togglePause() {
            if (!game.running && snake.maxCells > 3) {
                startGame();
                return;
            }
            
            game.running = !game.running;
            
            if (game.running) {
                gameStatusElement.textContent = "游戏中...";
                game.gameLoop = setInterval(update, 1000 / game.speed);
            } else {
                gameStatusElement.textContent = "游戏已暂停";
                clearInterval(game.gameLoop);
            }
        }
        
        // 键盘控制
        function handleKeyDown(e) {
            // 防止方向键滚动页面
            if ([37, 38, 39, 40, 32, 87, 65, 83, 68].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            // 空格键：开始/暂停
            if (e.keyCode === 32) {
                if (!game.running && snake.maxCells === 3) {
                    startGame();
                } else {
                    togglePause();
                }
            }
            
            // 如果游戏未运行，不接受方向控制
            if (!game.running) return;
            
            // 方向键控制
            if ((e.keyCode === 37 || e.keyCode === 65) && snake.dx === 0) { // 左箭头或A键
                snake.dx = -1;
                snake.dy = 0;
            } else if ((e.keyCode === 38 || e.keyCode === 87) && snake.dy === 0) { // 上箭头或W键
                snake.dx = 0;
                snake.dy = -1;
            } else if ((e.keyCode === 39 || e.keyCode === 68) && snake.dx === 0) { // 右箭头或D键
                snake.dx = 1;
                snake.dy = 0;
            } else if ((e.keyCode === 40 || e.keyCode === 83) && snake.dy === 0) { // 下箭头或S键
                snake.dx = 0;
                snake.dy = 1;
            }
        }
        
        // 移动控制函数
        function moveUp() {
            if (game.running && snake.dy === 0) {
                snake.dx = 0;
                snake.dy = -1;
            }
        }
        
        function moveLeft() {
            if (game.running && snake.dx === 0) {
                snake.dx = -1;
                snake.dy = 0;
            }
        }
        
        function moveRight() {
            if (game.running && snake.dx === 0) {
                snake.dx = 1;
                snake.dy = 0;
            }
        }
        
        function moveDown() {
            if (game.running && snake.dy === 0) {
                snake.dx = 0;
                snake.dy = 1;
            }
        }
        
        // 事件监听
        document.addEventListener('keydown', handleKeyDown);
        
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', initGame);
        
        // 移动端控制
        upBtn.addEventListener('click', moveUp);
        leftBtn.addEventListener('click', moveLeft);
        rightBtn.addEventListener('click', moveRight);
        downBtn.addEventListener('click', moveDown);
        
        // 移动端触摸控制
        upBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveUp();
        });
        
        leftBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveLeft();
        });
        
        rightBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveRight();
        });
        
        downBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveDown();
        });
        
        // 初始化游戏
        initGame();
        updateUI();
    </script>
</body>
</html>
