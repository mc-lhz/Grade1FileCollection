<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - 改进版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .game-container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            color: white;
            width: 200px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .score-section {
            margin-bottom: 20px;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .score-label {
            color: #aaa;
        }

        .score-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .controls {
            margin-top: 20px;
        }

        .control-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 8px;
            color: #0f0c29;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn.pause {
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
        }

        .control-btn.reset {
            background: linear-gradient(45deg, #ff4757, #ff3838);
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
            background: #0a0a15;
        }

        .instructions {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .key {
            display: inline-block;
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 2px;
            color: #fff;
            font-family: monospace;
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
            max-width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 50%;
            color: #00ff88;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .mobile-btn:active {
            background: rgba(0, 255, 136, 0.5);
        }

        .mobile-btn.up { grid-column: 2; grid-row: 1; }
        .mobile-btn.down { grid-column: 2; grid-row: 2; }
        .mobile-btn.left { grid-column: 1; grid-row: 2; }
        .mobile-btn.right { grid-column: 3; grid-row: 2; }

        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }
            
            .info-panel {
                width: 100%;
                max-width: 400px;
                margin-bottom: 20px;
            }
            
            .mobile-controls {
                display: grid;
            }
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-title {
            color: #00ff88;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
        }

        .overlay-subtitle {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .overlay-score {
            color: #ff9a00;
            font-size: 2rem;
            margin-bottom: 40px;
        }

        .difficulty-selector {
            margin-top: 15px;
        }

        .difficulty-label {
            color: #aaa;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .difficulty-options {
            display: flex;
            gap: 8px;
        }

        .difficulty-btn {
            flex: 1;
            padding: 8px 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            border-radius: 5px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .difficulty-btn.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            color: #00ff88;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ff88;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- 背景粒子效果 -->
    <div class="particles" id="particles"></div>
    
    <div class="game-wrapper">
        <div class="info-panel">
            <div class="score-section">
                <div class="score-item">
                    <span class="score-label">当前得分</span>
                    <span class="score-value" id="currentScore">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">最高分</span>
                    <span class="score-value" id="highScore">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">长度</span>
                    <span class="score-value" id="snakeLength">3</span>
                </div>
                <div class="score-item">
                    <span class="score-label">速度</span>
                    <span class="score-value" id="gameSpeed">1</span>
                </div>
            </div>
            
            <div class="difficulty-selector">
                <div class="difficulty-label">难度级别</div>
                <div class="difficulty-options">
                    <button class="difficulty-btn active" data-speed="150">简单</button>
                    <button class="difficulty-btn" data-speed="100">中等</button>
                    <button class="difficulty-btn" data-speed="70">困难</button>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" id="startBtn">开始游戏</button>
                <button class="control-btn pause" id="pauseBtn">暂停游戏</button>
                <button class="control-btn reset" id="resetBtn">重新开始</button>
            </div>
            
            <div class="instructions">
                <p><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 控制方向</p>
                <p><span class="key">空格</span> 暂停/继续</p>
                <p>🌀 穿墙模式 | 撞到自己失败</p>
            </div>
        </div>
        
        <div class="game-container">
            <h1>🐍 贪吃蛇</h1>
            <div style="position: relative;">
                <canvas id="gameCanvas" width="480" height="360"></canvas>
                <div class="game-overlay" id="startOverlay">
                    <div class="overlay-title">贪吃蛇</div>
                    <div class="overlay-subtitle">选择难度并开始游戏</div>
                    <button class="control-btn" id="overlayStartBtn">开始游戏</button>
                </div>
                <div class="game-overlay" id="gameOverOverlay">
                    <div class="overlay-title">游戏结束!</div>
                    <div class="overlay-score" id="finalScore">得分: 0</div>
                    <button class="control-btn" id="restartBtn">再来一局</button>
                </div>
            </div>
            
            <!-- 移动端控制 -->
            <div class="mobile-controls">
                <div class="mobile-btn up" id="upBtn">↑</div>
                <div class="mobile-btn down" id="downBtn">↓</div>
                <div class="mobile-btn left" id="leftBtn">←</div>
                <div class="mobile-btn right" id="rightBtn">→</div>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            COLS: 16,
            ROWS: 12,
            CELL_SIZE: 30,
            INITIAL_SPEED: 150,
            MIN_SPEED: 50,
            SPEED_INCREMENT: 2,
            POINTS_PER_FOOD: 10
        };

        // 游戏状态
        let canvas, ctx;
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameLoop = null;
        let isRunning = false;
        let isPaused = false;
        let currentSpeed = CONFIG.INITIAL_SPEED;
        let particles = [];

        // DOM元素
        const elements = {
            canvas: document.getElementById('gameCanvas'),
            currentScore: document.getElementById('currentScore'),
            highScore: document.getElementById('highScore'),
            snakeLength: document.getElementById('snakeLength'),
            gameSpeed: document.getElementById('gameSpeed'),
            startBtn: document.getElementById('startBtn'),
            pauseBtn: document.getElementById('pauseBtn'),
            resetBtn: document.getElementById('resetBtn'),
            overlayStartBtn: document.getElementById('overlayStartBtn'),
            restartBtn: document.getElementById('restartBtn'),
            startOverlay: document.getElementById('startOverlay'),
            gameOverOverlay: document.getElementById('gameOverOverlay'),
            finalScore: document.getElementById('finalScore'),
            difficultyBtns: document.querySelectorAll('.difficulty-btn'),
            upBtn: document.getElementById('upBtn'),
            downBtn: document.getElementById('downBtn'),
            leftBtn: document.getElementById('leftBtn'),
            rightBtn: document.getElementById('rightBtn')
        };

        // 初始化
        function init() {
            canvas = elements.canvas;
            ctx = canvas.getContext('2d');
            
            // 设置最高分
            elements.highScore.textContent = highScore;
            
            // 创建背景粒子
            createParticles();
            
            // 绑定事件
            bindEvents();
            
            // 绘制初始画面
            drawInitialScreen();
            
            // 显示开始界面
            showOverlay(elements.startOverlay);
        }

        // 创建背景粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 15}s`;
                particle.style.animationDuration = `${15 + Math.random() * 10}s`;
                container.appendChild(particle);
            }
        }

        // 绑定事件
        function bindEvents() {
            // 键盘事件
            document.addEventListener('keydown', handleKeyPress);
            
            // 按钮事件
            elements.startBtn.addEventListener('click', startGame);
            elements.pauseBtn.addEventListener('click', togglePause);
            elements.resetBtn.addEventListener('click', resetGame);
            elements.overlayStartBtn.addEventListener('click', startGame);
            elements.restartBtn.addEventListener('click', resetGame);
            
            // 难度选择
            elements.difficultyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.difficultyBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSpeed = parseInt(btn.dataset.speed);
                    elements.gameSpeed.textContent = getSpeedLevel(currentSpeed);
                    
                    if (isRunning && !isPaused) {
                        clearInterval(gameLoop);
                        gameLoop = setInterval(gameUpdate, currentSpeed);
                    }
                });
            });
            
            // 移动端控制
            elements.upBtn.addEventListener('click', () => changeDirection({x: 0, y: -1}));
            elements.downBtn.addEventListener('click', () => changeDirection({x: 0, y: 1}));
            elements.leftBtn.addEventListener('click', () => changeDirection({x: -1, y: 0}));
            elements.rightBtn.addEventListener('click', () => changeDirection({x: 1, y: 0}));
            
            // 触摸控制
            let touchStartX = 0, touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            canvas.addEventListener('touchend', (e) => {
                if (!isRunning || isPaused) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平滑动
                    if (dx > 0 && direction.x !== -1) {
                        changeDirection({x: 1, y: 0});
                    } else if (dx < 0 && direction.x !== 1) {
                        changeDirection({x: -1, y: 0});
                    }
                } else {
                    // 垂直滑动
                    if (dy > 0 && direction.y !== -1) {
                        changeDirection({x: 0, y: 1});
                    } else if (dy < 0 && direction.y !== 1) {
                        changeDirection({x: 0, y: -1});
                    }
                }
            });
        }

        // 获取速度等级显示
        function getSpeedLevel(speed) {
            if (speed >= 120) return "1";
            if (speed >= 80) return "2";
            return "3";
        }

        // 显示覆盖层
        function showOverlay(overlay) {
            hideAllOverlays();
            overlay.classList.add('active');
        }

        // 隐藏所有覆盖层
        function hideAllOverlays() {
            elements.startOverlay.classList.remove('active');
            elements.gameOverOverlay.classList.remove('active');
        }

        // 绘制初始屏幕
        function drawInitialScreen() {
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            // 绘制示例蛇
            const exampleSnake = [
                {x: 8, y: 6},
                {x: 7, y: 6},
                {x: 6, y: 6}
            ];
            
            exampleSnake.forEach((segment, index) => {
                const x = segment.x * CONFIG.CELL_SIZE;
                const y = segment.y * CONFIG.CELL_SIZE;
                
                const greenValue = Math.max(100, 255 - index * 30);
                ctx.fillStyle = `rgb(0, ${greenValue}, 100)`;
                
                roundRect(ctx, x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4, 4);
                ctx.fill();
            });
            
            // 绘制示例食物
            const foodX = 11 * CONFIG.CELL_SIZE;
            const foodY = 6 * CONFIG.CELL_SIZE;
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(foodX + CONFIG.CELL_SIZE/2, foodY + CONFIG.CELL_SIZE/2, CONFIG.CELL_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= CONFIG.COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CONFIG.CELL_SIZE, 0);
                ctx.lineTo(i * CONFIG.CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            
            for (let i = 0; i <= CONFIG.ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * CONFIG.CELL_SIZE);
                ctx.lineTo(canvas.width, i * CONFIG.CELL_SIZE);
                ctx.stroke();
            }
        }

        // 开始游戏
        function startGame() {
            if (isRunning && !isPaused) return;
            
            hideAllOverlays();
            
            // 如果是重新开始，重置游戏状态
            if (!isRunning) {
                resetGameState();
            }
            
            isRunning = true;
            isPaused = false;
            
            // 开始游戏循环
            gameLoop = setInterval(gameUpdate, currentSpeed);
        }

        // 重置游戏状态
        function resetGameState() {
            snake = [
                { x: 5, y: 6 },
                { x: 4, y: 6 },
                { x: 3, y: 6 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            elements.currentScore.textContent = score;
            elements.snakeLength.textContent = snake.length;
            generateFood();
        }

        // 切换暂停状态
        function togglePause() {
            if (!isRunning) return;
            
            isPaused = !isPaused;
            
            if (isPaused) {
                clearInterval(gameLoop);
                elements.pauseBtn.textContent = "继续游戏";
            } else {
                gameLoop = setInterval(gameUpdate, currentSpeed);
                elements.pauseBtn.textContent = "暂停游戏";
            }
        }

        // 重置游戏
        function resetGame() {
            clearInterval(gameLoop);
            isRunning = false;
            isPaused = false;
            elements.pauseBtn.textContent = "暂停游戏";
            resetGameState();
            draw();
            showOverlay(elements.startOverlay);
        }

        // 游戏更新
        function gameUpdate() {
            // 更新方向
            direction = { ...nextDirection };
            
            // 计算新头部位置
            let newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            // 穿墙处理
            if (newHead.x < 0) newHead.x = CONFIG.COLS - 1;
            if (newHead.x >= CONFIG.COLS) newHead.x = 0;
            if (newHead.y < 0) newHead.y = CONFIG.ROWS - 1;
            if (newHead.y >= CONFIG.ROWS) newHead.y = 0;
            
            // 检查是否撞到自己
            if (checkSelfCollision(newHead)) {
                gameOver();
                return;
            }
            
            // 移动蛇
            snake.unshift(newHead);
            
            // 检查是否吃到食物
            if (newHead.x === food.x && newHead.y === food.y) {
                score += CONFIG.POINTS_PER_FOOD;
                elements.currentScore.textContent = score;
                elements.snakeLength.textContent = snake.length;
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    elements.highScore.textContent = highScore;
                }
                
                // 加速
                if (currentSpeed > CONFIG.MIN_SPEED) {
                    currentSpeed -= CONFIG.SPEED_INCREMENT;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameUpdate, currentSpeed);
                    elements.gameSpeed.textContent = getSpeedLevel(currentSpeed);
                }
                
                generateFood();
            } else {
                snake.pop();
            }
            
            // 重绘画面
            draw();
        }

        // 检查自碰撞
        function checkSelfCollision(head) {
            // 跳过头部检查（因为头部是新位置）
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            return false;
        }

        // 生成食物
        function generateFood() {
            let attempts = 0;
            do {
                food = {
                    x: Math.floor(Math.random() * CONFIG.COLS),
                    y: Math.floor(Math.random() * CONFIG.ROWS)
                };
                attempts++;
                // 防止无限循环
                if (attempts > 100) break;
            } while (isOnSnake(food));
        }

        // 检查位置是否在蛇身上
        function isOnSnake(pos) {
            return snake.some(segment => segment.x === pos.x && segment.y === pos.y);
        }

        // 绘制游戏画面
        function draw() {
            // 清空画布
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            drawGrid();
            
            // 绘制食物
            drawFood();
            
            // 绘制蛇
            drawSnake();
        }

        // 绘制食物
        function drawFood() {
            const x = food.x * CONFIG.CELL_SIZE;
            const y = food.y * CONFIG.CELL_SIZE;
            
            // 食物发光效果
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 15;
            
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2, CONFIG.CELL_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 食物高光
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(x + CONFIG.CELL_SIZE/3, y + CONFIG.CELL_SIZE/3, CONFIG.CELL_SIZE/6, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制蛇
        function drawSnake() {
            snake.forEach((segment, index) => {
                const x = segment.x * CONFIG.CELL_SIZE;
                const y = segment.y * CONFIG.CELL_SIZE;
                
                // 蛇身渐变颜色
                const greenValue = Math.max(100, 255 - index * 3);
                ctx.fillStyle = `rgb(0, ${greenValue}, 100)`;
                
                // 头部特殊处理
                if (index === 0) {
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 10;
                    
                    // 圆角矩形头部
                    roundRect(ctx, x + 1, y + 1, CONFIG.CELL_SIZE - 2, CONFIG.CELL_SIZE - 2, 6);
                    ctx.fill();
                    
                    // 眼睛
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    const eyeSize = 4;
                    const eyeOffset = 8;
                    
                    if (direction.x === 1) {
                        ctx.fillRect(x + CONFIG.CELL_SIZE - eyeOffset - eyeSize, y + 8, eyeSize, eyeSize);
                        ctx.fillRect(x + CONFIG.CELL_SIZE - eyeOffset - eyeSize, y + CONFIG.CELL_SIZE - 12, eyeSize, eyeSize);
                    } else if (direction.x === -1) {
                        ctx.fillRect(x + eyeOffset, y + 8, eyeSize, eyeSize);
                        ctx.fillRect(x + eyeOffset, y + CONFIG.CELL_SIZE - 12, eyeSize, eyeSize);
                    } else if (direction.y === -1) {
                        ctx.fillRect(x + 8, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + CONFIG.CELL_SIZE - 12, y + eyeOffset, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(x + 8, y + CONFIG.CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(x + CONFIG.CELL_SIZE - 12, y + CONFIG.CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    }
                } else {
                    ctx.shadowBlur = 0;
                    roundRect(ctx, x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4, 4);
                    ctx.fill();
                }
            });
        }

        // 绘制圆角矩形
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // 游戏结束
        function gameOver() {
            isRunning = false;
            clearInterval(gameLoop);
            
            // 显示游戏结束界面
            elements.finalScore.textContent = `得分: ${score}`;
            showOverlay(elements.gameOverOverlay);
        }

        // 改变方向
        function changeDirection(newDir) {
            // 防止180度转向
            if (
                (newDir.x !== 0 && direction.x === -newDir.x) ||
                (newDir.y !== 0 && direction.y === -newDir.y)
            ) {
                return;
            }
            nextDirection = newDir;
        }

        // 键盘控制
        function handleKeyPress(e) {
            // 空格键暂停/继续
            if (e.key === ' ') {
                e.preventDefault();
                if (!isRunning) {
                    startGame();
                } else {
                    togglePause();
                }
                return;
            }
            
            if (!isRunning || isPaused) return;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection({ x: 0, y: -1 });
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection({ x: 0, y: 1 });
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection({ x: -1, y: 0 });
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection({ x: 1, y: 0 });
                    break;
            }
        }

        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
