<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff88;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            color: #fff;
            font-size: 18px;
        }

        .score-board span {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: #0a0a15;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            border: none;
            color: #1a1a2e;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .instructions {
            color: #888;
            margin-top: 15px;
            font-size: 14px;
        }

        .instructions kbd {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="score-board">
            <span>得分: <b id="score">0</b></span>
            <span>最高分: <b id="highScore">0</b></span>
        </div>
        <canvas id="gameCanvas" width="480" height="360"></canvas>
        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
            <button onclick="pauseGame()">暂停/继续</button>
        </div>
        <div class="instructions">
            <p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向</p>
            <p>🌀 支持穿墙模式 | 撞到自己则游戏结束</p>
        </div>
    </div>

    <script>
        // 游戏配置
        const COLS = 16;  // 列数
        const ROWS = 12;  // 行数
        const CELL_SIZE = 30;  // 每个格子大小
        const INITIAL_SPEED = 150;  // 初始速度（毫秒）

        // 游戏状态
        let canvas, ctx;
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let isRunning = false;
        let isPaused = false;
        let speed = INITIAL_SPEED;

        // 初始化
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            document.getElementById('highScore').textContent = highScore;
            
            // 键盘事件监听
            document.addEventListener('keydown', handleKeyPress);
            
            // 绘制初始画面
            drawInitialScreen();
        }

        // 绘制初始屏幕
        function drawInitialScreen() {
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('点击"开始游戏"按钮', canvas.width / 2, canvas.height / 2);
            ctx.font = '16px Arial';
            ctx.fillText('或按空格键开始', canvas.width / 2, canvas.height / 2 + 30);
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        // 开始游戏
        function startGame() {
            if (isRunning && !isPaused) return;
            
            // 重置游戏状态
            snake = [
                { x: 5, y: 6 },
                { x: 4, y: 6 },
                { x: 3, y: 6 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = INITIAL_SPEED;
            document.getElementById('score').textContent = score;
            
            // 生成食物
            generateFood();
            
            // 清除旧的游戏循环
            if (gameLoop) clearInterval(gameLoop);
            
            // 开始新的游戏循环
            isRunning = true;
            isPaused = false;
            gameLoop = setInterval(gameUpdate, speed);
        }

        // 暂停/继续
        function pauseGame() {
            if (!isRunning) return;
            
            isPaused = !isPaused;
            
            if (isPaused) {
                clearInterval(gameLoop);
                drawPauseScreen();
            } else {
                gameLoop = setInterval(gameUpdate, speed);
            }
        }

        // 绘制暂停画面
        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('暂停', canvas.width / 2, canvas.height / 2);
        }

        // 游戏更新
        function gameUpdate() {
            // 更新方向
            direction = { ...nextDirection };
            
            // 计算新头部位置
            let newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            // 穿墙处理
            if (newHead.x < 0) newHead.x = COLS - 1;
            if (newHead.x >= COLS) newHead.x = 0;
            if (newHead.y < 0) newHead.y = ROWS - 1;
            if (newHead.y >= ROWS) newHead.y = 0;
            
            // 检查是否撞到自己
            if (checkSelfCollision(newHead)) {
                gameOver();
                return;
            }
            
            // 移动蛇
            snake.unshift(newHead);
            
            // 检查是否吃到食物
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }
                
                // 加速
                if (speed > 50) {
                    speed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameUpdate, speed);
                }
                
                generateFood();
            } else {
                snake.pop();
            }
            
            // 重绘画面
            draw();
        }

        // 检查自碰撞
        function checkSelfCollision(head) {
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            return false;
        }

        // 生成食物
        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (isOnSnake(food));
        }

        // 检查位置是否在蛇身上
        function isOnSnake(pos) {
            return snake.some(segment => segment.x === pos.x && segment.y === pos.y);
        }

        // 绘制游戏画面
        function draw() {
            // 清空画布
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            drawGrid();
            
            // 绘制食物
            drawFood();
            
            // 绘制蛇
            drawSnake();
        }

        // 绘制食物
        function drawFood() {
            const x = food.x * CELL_SIZE;
            const y = food.y * CELL_SIZE;
            
            // 食物发光效果
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 15;
            
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(x + CELL_SIZE / 2, y + CELL_SIZE / 2, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            
            // 食物高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(x + CELL_SIZE / 3, y + CELL_SIZE / 3, CELL_SIZE / 6, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制蛇
        function drawSnake() {
            snake.forEach((segment, index) => {
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                
                // 蛇身渐变颜色
                const greenValue = Math.max(100, 255 - index * 3);
                ctx.fillStyle = `rgb(0, ${greenValue}, 100)`;
                
                // 头部特殊处理
                if (index === 0) {
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 10;
                    
                    // 圆角矩形头部
                    roundRect(ctx, x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, 6);
                    ctx.fill();
                    
                    // 眼睛
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    const eyeSize = 4;
                    const eyeOffset = 8;
                    
                    if (direction.x === 1) {
                        ctx.fillRect(x + CELL_SIZE - eyeOffset - eyeSize, y + 8, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - eyeOffset - eyeSize, y + CELL_SIZE - 12, eyeSize, eyeSize);
                    } else if (direction.x === -1) {
                        ctx.fillRect(x + eyeOffset, y + 8, eyeSize, eyeSize);
                        ctx.fillRect(x + eyeOffset, y + CELL_SIZE - 12, eyeSize, eyeSize);
                    } else if (direction.y === -1) {
                        ctx.fillRect(x + 8, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 12, y + eyeOffset, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(x + 8, y + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 12, y + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    }
                } else {
                    ctx.shadowBlur = 0;
                    roundRect(ctx, x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 4);
                    ctx.fill();
                }
            });
        }

        // 绘制圆角矩形
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // 游戏结束
        function gameOver() {
            isRunning = false;
            clearInterval(gameLoop);
            
            // 绘制游戏结束画面
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff4757';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.fillStyle = '#fff';
            ctx.font = '24px Arial';
            ctx.fillText(`得分: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
            
            ctx.fillStyle = '#00ff88';
            ctx.font = '18px Arial';
            ctx.fillText('点击"开始游戏"重新开始', canvas.width / 2, canvas.height / 2 + 60);
        }

        // 键盘控制
        function handleKeyPress(e) {
            // 空格键开始/暂停
            if (e.key === ' ') {
                e.preventDefault();
                if (!isRunning) {
                    startGame();
                } else {
                    pauseGame();
                }
                return;
            }
            
            if (!isRunning || isPaused) return;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    break;
            }
        }

        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
