<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克动荡 - 玩家 vs AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #444;
        }
        
        .info-box {
            text-align: center;
        }
        
        .info-label {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .info-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4dccbd;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
        }
        
        canvas {
            background-color: #0d1929;
            border-radius: 10px;
            border: 3px solid #2a3b5c;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
            margin: 0 auto;
        }
        
        .controls {
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            border: 1px solid #444;
        }
        
        .controls h3 {
            margin-bottom: 10px;
            color: #feb47b;
        }
        
        .key {
            display: inline-block;
            background-color: #333;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #555;
            font-weight: bold;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            display: none;
            border: 2px solid #ff7e5f;
            width: 80%;
            max-width: 400px;
        }
        
        .game-over h2 {
            color: #ff7e5f;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .restart-btn {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
        }
        
        footer {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            width: 100%;
            max-width: 800px;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .game-info {
                flex-direction: column;
                gap: 10px;
            }
            
            canvas {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>坦克动荡</h1>
        <p>玩家 vs AI - 摧毁所有敌方坦克！</p>
    </header>
    
    <div class="game-info">
        <div class="info-box">
            <div class="info-label">玩家生命值</div>
            <div class="info-value" id="player-health">100</div>
        </div>
        <div class="info-box">
            <div class="info-label">敌方剩余</div>
            <div class="info-value" id="enemies-left">5</div>
        </div>
        <div class="info-box">
            <div class="info-label">得分</div>
            <div class="info-value" id="score">0</div>
        </div>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="game-over" id="game-over">
            <h2 id="game-over-text">游戏结束</h2>
            <p id="final-score">得分: 0</p>
            <button class="restart-btn" id="restart-btn">重新开始</button>
        </div>
    </div>
    
    <div class="controls">
        <h3>控制方式</h3>
        <div>
            <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> - 移动坦克
        </div>
        <div>
            <span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span> - 旋转炮塔
        </div>
        <div>
            <span class="key">空格键</span> - 发射炮弹
        </div>
    </div>
    
    <footer>
        <p>使用 WASD 移动坦克，方向键控制炮塔，空格键射击 | 击败所有AI坦克获胜！</p>
    </footer>

    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏状态
        let gameRunning = true;
        let score = 0;
        let playerHealth = 100;
        let enemiesLeft = 5;
        
        // 更新UI显示
        function updateUI() {
            document.getElementById('player-health').textContent = playerHealth;
            document.getElementById('enemies-left').textContent = enemiesLeft;
            document.getElementById('score').textContent = score;
        }
        
        // 坦克基类
        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 60;
                this.color = color;
                this.speed = isPlayer ? 3 : 1.5;
                this.direction = 0; // 0: 上, 1: 右, 2: 下, 3: 左
                this.turretAngle = 0;
                this.health = isPlayer ? 100 : 50;
                this.isPlayer = isPlayer;
                this.cooldown = 0;
                this.maxCooldown = isPlayer ? 15 : 60; // 玩家射速更快
                this.bullets = [];
            }
            
            draw() {
                // 保存画布状态
                ctx.save();
                
                // 移动到坦克位置
                ctx.translate(this.x, this.y);
                
                // 绘制坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                
                // 绘制坦克履带
                ctx.fillStyle = '#222';
                ctx.fillRect(-this.width/2 - 5, -this.height/2, 5, this.height);
                ctx.fillRect(this.width/2, -this.height/2, 5, this.height);
                
                // 绘制炮塔
                ctx.rotate(this.turretAngle);
                ctx.fillStyle = this.color;
                ctx.fillRect(0, -10, 40, 20);
                
                // 绘制炮管
                ctx.fillStyle = '#555';
                ctx.fillRect(40, -5, 20, 10);
                
                // 恢复画布状态
                ctx.restore();
                
                // 绘制生命条
                const healthWidth = 40;
                const healthHeight = 5;
                const healthX = this.x - healthWidth/2;
                const healthY = this.y - this.height/2 - 15;
                
                // 背景条
                ctx.fillStyle = '#555';
                ctx.fillRect(healthX, healthY, healthWidth, healthHeight);
                
                // 生命值条
                const healthPercent = this.health / (this.isPlayer ? 100 : 50);
                ctx.fillStyle = this.isPlayer ? '#4dccbd' : '#ff7e5f';
                ctx.fillRect(healthX, healthY, healthWidth * healthPercent, healthHeight);
                
                // 绘制子弹
                for (let bullet of this.bullets) {
                    bullet.draw();
                }
            }
            
            move(dx, dy) {
                // 检查边界
                const newX = this.x + dx * this.speed;
                const newY = this.y + dy * this.speed;
                
                if (newX > this.width/2 && newX < canvas.width - this.width/2) {
                    this.x = newX;
                }
                
                if (newY > this.height/2 && newY < canvas.height - this.height/2) {
                    this.y = newY;
                }
            }
            
            rotateTurret(angle) {
                this.turretAngle += angle;
            }
            
            shoot() {
                if (this.cooldown <= 0) {
                    const bulletSpeed = 8;
                    const bulletX = this.x + Math.cos(this.turretAngle) * 60;
                    const bulletY = this.y + Math.sin(this.turretAngle) * 60;
                    
                    this.bullets.push(new Bullet(
                        bulletX, 
                        bulletY, 
                        this.turretAngle, 
                        bulletSpeed, 
                        this.isPlayer ? '#4dccbd' : '#ff7e5f'
                    ));
                    
                    this.cooldown = this.maxCooldown;
                }
            }
            
            update() {
                // 冷却时间减少
                if (this.cooldown > 0) {
                    this.cooldown--;
                }
                
                // 更新子弹
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    this.bullets[i].update();
                    
                    // 移除超出边界的子弹
                    if (this.bullets[i].x < 0 || this.bullets[i].x > canvas.width ||
                        this.bullets[i].y < 0 || this.bullets[i].y > canvas.height) {
                        this.bullets.splice(i, 1);
                    }
                }
            }
        }
        
        // 子弹类
        class Bullet {
            constructor(x, y, angle, speed, color) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = speed;
                this.color = color;
                this.radius = 5;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
            
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }
        }
        
        // 障碍物类
        class Obstacle {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }
            
            draw() {
                ctx.fillStyle = '#555';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // 添加纹理
                ctx.strokeStyle = '#777';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                // 内部网格
                ctx.beginPath();
                ctx.moveTo(this.x + this.width/2, this.y);
                ctx.lineTo(this.x + this.width/2, this.y + this.height);
                ctx.moveTo(this.x, this.y + this.height/2);
                ctx.lineTo(this.x + this.width, this.y + this.height/2);
                ctx.stroke();
            }
        }
        
        // 创建玩家坦克
        const player = new Tank(canvas.width/2, canvas.height - 100, '#4dccbd', true);
        
        // 创建AI坦克
        const enemies = [];
        function createEnemies(count) {
            enemies.length = 0;
            for (let i = 0; i < count; i++) {
                const x = Math.random() * (canvas.width - 100) + 50;
                const y = Math.random() * 150 + 50;
                enemies.push(new Tank(x, y, '#ff7e5f'));
            }
            enemiesLeft = count;
        }
        
        // 创建障碍物
        const obstacles = [
            new Obstacle(200, 150, 80, 80),
            new Obstacle(500, 200, 120, 60),
            new Obstacle(300, 350, 100, 100),
            new Obstacle(600, 300, 80, 120)
        ];
        
        // 键盘控制
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            // 防止空格键滚动页面
            if (e.key === ' ') {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        // 处理玩家输入
        function handleInput() {
            // 移动控制 (WASD)
            if (keys['w']) player.move(0, -1);
            if (keys['s']) player.move(0, 1);
            if (keys['a']) player.move(-1, 0);
            if (keys['d']) player.move(1, 0);
            
            // 炮塔旋转 (方向键)
            if (keys['arrowleft']) player.rotateTurret(-0.05);
            if (keys['arrowright']) player.rotateTurret(0.05);
            
            // 射击 (空格键)
            if (keys[' ']) player.shoot();
        }
        
        // AI控制
        function updateAI() {
            for (let enemy of enemies) {
                // 简单的AI：随机移动，偶尔转向玩家
                if (Math.random() < 0.02) {
                    enemy.direction = Math.floor(Math.random() * 4);
                }
                
                // 根据方向移动
                switch(enemy.direction) {
                    case 0: enemy.move(0, -1); break;
                    case 1: enemy.move(1, 0); break;
                    case 2: enemy.move(0, 1); break;
                    case 3: enemy.move(-1, 0); break;
                }
                
                // 炮塔指向玩家
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                enemy.turretAngle = Math.atan2(dy, dx);
                
                // 随机射击
                if (Math.random() < 0.01) {
                    enemy.shoot();
                }
                
                enemy.update();
            }
        }
        
        // 碰撞检测
        function checkCollisions() {
            // 玩家子弹与敌人碰撞
            for (let i = player.bullets.length - 1; i >= 0; i--) {
                const bullet = player.bullets[i];
                
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    
                    // 简单矩形碰撞检测
                    if (bullet.x > enemy.x - enemy.width/2 &&
                        bullet.x < enemy.x + enemy.width/2 &&
                        bullet.y > enemy.y - enemy.height/2 &&
                        bullet.y < enemy.y + enemy.height/2) {
                        
                        // 减少敌人生命值
                        enemy.health -= 25;
                        
                        // 移除子弹
                        player.bullets.splice(i, 1);
                        
                        // 如果敌人生命值耗尽
                        if (enemy.health <= 0) {
                            enemies.splice(j, 1);
                            enemiesLeft--;
                            score += 100;
                        }
                        
                        break;
                    }
                }
            }
            
            // 敌人子弹与玩家碰撞
            for (let enemy of enemies) {
                for (let i = enemy.bullets.length - 1; i >= 0; i--) {
                    const bullet = enemy.bullets[i];
                    
                    // 简单矩形碰撞检测
                    if (bullet.x > player.x - player.width/2 &&
                        bullet.x < player.x + player.width/2 &&
                        bullet.y > player.y - player.height/2 &&
                        bullet.y < player.y + player.height/2) {
                        
                        // 减少玩家生命值
                        playerHealth -= 15;
                        
                        // 移除子弹
                        enemy.bullets.splice(i, 1);
                        
                        // 检查游戏是否结束
                        if (playerHealth <= 0) {
                            gameOver(false);
                        }
                        
                        break;
                    }
                }
            }
            
            // 子弹与障碍物碰撞
            for (let obstacle of obstacles) {
                // 检查玩家子弹
                for (let i = player.bullets.length - 1; i >= 0; i--) {
                    const bullet = player.bullets[i];
                    
                    if (bullet.x > obstacle.x && bullet.x < obstacle.x + obstacle.width &&
                        bullet.y > obstacle.y && bullet.y < obstacle.y + obstacle.height) {
                        player.bullets.splice(i, 1);
                    }
                }
                
                // 检查敌人子弹
                for (let enemy of enemies) {
                    for (let i = enemy.bullets.length - 1; i >= 0; i--) {
                        const bullet = enemy.bullets[i];
                        
                        if (bullet.x > obstacle.x && bullet.x < obstacle.x + obstacle.width &&
                            bullet.y > obstacle.y && bullet.y < obstacle.y + obstacle.height) {
                            enemy.bullets.splice(i, 1);
                        }
                    }
                }
            }
            
            // 检查是否所有敌人都被消灭
            if (enemies.length === 0 && gameRunning) {
                gameOver(true);
            }
        }
        
        // 游戏结束
        function gameOver(playerWon) {
            gameRunning = false;
            const gameOverDiv = document.getElementById('game-over');
            const gameOverText = document.getElementById('game-over-text');
            const finalScore = document.getElementById('final-score');
            
            if (playerWon) {
                gameOverText.textContent = "胜利!";
                gameOverText.style.color = "#4dccbd";
                score += 500; // 胜利奖励
            } else {
                gameOverText.textContent = "游戏结束";
                gameOverText.style.color = "#ff7e5f";
            }
            
            finalScore.textContent = `最终得分: ${score}`;
            gameOverDiv.style.display = 'block';
        }
        
        // 重新开始游戏
        document.getElementById('restart-btn').addEventListener('click', () => {
            // 重置游戏状态
            gameRunning = true;
            score = 0;
            playerHealth = 100;
            
            // 重置玩家
            player.x = canvas.width/2;
            player.y = canvas.height - 100;
            player.health = 100;
            player.bullets = [];
            player.turretAngle = 0;
            
            // 创建新敌人
            createEnemies(5);
            
            // 隐藏游戏结束界面
            document.getElementById('game-over').style.display = 'none';
            
            // 更新UI
            updateUI();
        });
        
        // 游戏主循环
        function gameLoop() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景网格
            drawBackground();
            
            if (gameRunning) {
                // 处理输入
                handleInput();
                
                // 更新AI
                updateAI();
                
                // 更新玩家
                player.update();
                
                // 检查碰撞
                checkCollisions();
            }
            
            // 绘制障碍物
            for (let obstacle of obstacles) {
                obstacle.draw();
            }
            
            // 绘制玩家
            player.draw();
            
            // 绘制敌人
            for (let enemy of enemies) {
                enemy.draw();
            }
            
            // 更新UI
            updateUI();
            
            // 继续游戏循环
            requestAnimationFrame(gameLoop);
        }
        
        // 绘制背景网格
        function drawBackground() {
            // 绘制深色背景
            ctx.fillStyle = '#0d1929';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格线
            ctx.strokeStyle = '#1a2b3c';
            ctx.lineWidth = 1;
            
            // 垂直线
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 水平线
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // 初始化游戏
        createEnemies(5);
        updateUI();
        gameLoop();
    </script>
</body>
</html>
